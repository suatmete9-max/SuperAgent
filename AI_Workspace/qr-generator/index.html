<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCraft - Premium QR Code Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- QR Code Styling Library -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen font-['Plus_Jakarta_Sans'] antialiased overflow-x-hidden">
    
    <!-- Decorative Background Gradients -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[150px] pointer-events-none"></div>

    <!-- Header -->
    <header class="border-b border-slate-800/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-qrcode text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">QRCraft</h1>
                    <p class="text-xs text-slate-400 font-medium">Premium Studio</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="resetAll()" class="text-sm px-4 py-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-600 transition-all text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 md:px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Control Panel (7 Cols) -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Mode Selector Templates -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 backdrop-blur-xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Choose Content Type</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="type-tabs">
                    <button onclick="switchType('url')" data-type="url" class="type-btn active flex flex-col items-center gap-2 p-3 rounded-xl border border-indigo-500/30 bg-indigo-600/10 text-indigo-400 font-semibold text-sm transition-all">
                        <i class="fa-solid fa-link text-lg"></i> URL / Link
                    </button>
                    <button onclick="switchType('text')" data-type="text" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-800/80 bg-slate-900/50 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition-all">
                        <i class="fa-solid fa-align-left text-lg"></i> Plain Text
                    </button>
                    <button onclick="switchType('wifi')" data-type="wifi" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-800/80 bg-slate-900/50 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition-all">
                        <i class="fa-solid fa-wifi text-lg"></i> WiFi Access
                    </button>
                    <button onclick="switchType('whatsapp')" data-type="whatsapp" class="type-btn flex flex-col items-center gap-2 p-3 rounded-xl border border-slate-800/80 bg-slate-900/50 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition-all">
                        <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
                    </button>
                </div>
            </div>

            <!-- Content Input Fields -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Enter Details</h3>
                
                <!-- URL Input -->
                <div id="input-url-wrapper" class="input-wrapper space-y-2">
                    <label class="text-sm text-slate-300 font-medium">Target URL</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                            <i class="fa-solid fa-globe"></i>
                        </span>
                        <input type="url" id="input-url" value="https://google.com" placeholder="https://example.com" class="w-full pl-11 pr-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                    </div>
                </div>

                <!-- Text Input -->
                <div id="input-text-wrapper" class="input-wrapper hidden space-y-2">
                    <label class="text-sm text-slate-300 font-medium">Your Text / Message</label>
                    <textarea id="input-text" placeholder="Write your message here..." rows="3" class="w-full p-4 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm resize-none"></textarea>
                </div>

                <!-- WiFi Input -->
                <div id="input-wifi-wrapper" class="input-wrapper hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm text-slate-300 font-medium">Network Name (SSID)</label>
                        <input type="text" id="input-wifi-ssid" placeholder="My Home WiFi" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm text-slate-300 font-medium">Password</label>
                        <input type="password" id="input-wifi-password" placeholder="WiFi Password" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                    </div>
                    <div class="space-y-2 sm:col-span-2">
                        <label class="text-sm text-slate-300 font-medium">Network Type</label>
                        <select id="input-wifi-type" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                            <option value="WPA">WPA/WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">Unencrypted (Open)</option>
                        </select>
                    </div>
                </div>

                <!-- WhatsApp Input -->
                <div id="input-whatsapp-wrapper" class="input-wrapper hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm text-slate-300 font-medium">Country Code & Number</label>
                        <input type="text" id="input-wa-phone" placeholder="919876543210" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm text-slate-300 font-medium">Pre-filled Message (Optional)</label>
                        <input type="text" id="input-wa-text" placeholder="Hi! I want to connect." class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 transition-all text-sm">
                    </div>
                </div>
            </div>

            <!-- Customization Controls -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl space-y-6">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Customize Design</h3>
                
                <!-- Color Customization (Solid or Gradient) -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-sm text-slate-300 font-medium">Color Style</label>
                        <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800/60 text-xs">
                            <button onclick="toggleGradient(false)" id="color-solid-btn" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white font-semibold transition-all">Solid</button>
                            <button onclick="toggleGradient(true)" id="color-gradient-btn" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-slate-100 font-semibold transition-all">Gradient</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Primary / Solid Color -->
                        <div class="space-y-2">
                            <span class="text-xs text-slate-400 block" id="color-one-label">Foreground Color</span>
                            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                                <input type="color" id="color-primary" value="#6366f1" class="w-8 h-8 rounded border-none bg-transparent cursor-pointer">
                                <input type="text" id="color-primary-text" value="#6366f1" class="bg-transparent text-sm text-slate-200 outline-none w-full uppercase">
                            </div>
                        </div>
                        <!-- Secondary Color (For Gradient) -->
                        <div id="color-secondary-wrapper" class="space-y-2 opacity-50 pointer-events-none transition-all">
                            <span class="text-xs text-slate-400 block">Gradient Color 2</span>
                            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                                <input type="color" id="color-secondary" value="#a855f7" class="w-8 h-8 rounded border-none bg-transparent cursor-pointer">
                                <input type="text" id="color-secondary-text" value="#a855f7" class="bg-transparent text-sm text-slate-200 outline-none w-full uppercase">
                            </div>
                        </div>
                    </div>

                    <!-- Background Color -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <span class="text-xs text-slate-400 block">Background Color</span>
                            <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                                <input type="color" id="color-bg" value="#ffffff" class="w-8 h-8 rounded border-none bg-transparent cursor-pointer">
                                <input type="text" id="color-bg-text" value="#ffffff" class="bg-transparent text-sm text-slate-200 outline-none w-full uppercase">
                            </div>
                        </div>
                        <div class="space-y-2 flex items-end">
                            <button onclick="setTransparentBg()" class="w-full py-3 px-4 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/50 hover:border-slate-600 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-droplet-slash"></i> Transparent Bg
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Custom Shapes & Styling -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-slate-800/80">
                    <!-- Dot style -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-400 block">Dots Style</label>
                        <select id="style-dots" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 text-sm transition-all">
                            <option value="rounded">Rounded Smooth</option>
                            <option value="dots">Circular Dots</option>
                            <option value="classy">Classy Curved</option>
                            <option value="classy-rounded">Classy Rounded</option>
                            <option value="square" selected>Classic Square</option>
                            <option value="extra-rounded">Extra Rounded</option>
                        </select>
                    </div>
                    <!-- Corner Style -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-400 block">Corner Square Style</label>
                        <select id="style-corners" class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl outline-none text-slate-100 text-sm transition-all">
                            <option value="dot">Circular Dot</option>
                            <option value="square" selected>Classic Square</option>
                            <option value="extra-rounded">Extra Rounded</option>
                        </select>
                    </div>
                </div>

                <!-- Logo Overlays -->
                <div class="pt-4 border-t border-slate-800/80 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs text-slate-400 block">Add Center Logo / Icon</label>
                        <button onclick="removeLogo()" id="remove-logo-btn" class="text-xs text-rose-400 hover:text-rose-300 font-semibold transition-all hidden">Remove Logo</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                        <!-- Preset logos -->
                        <button onclick="selectPresetLogo('none')" class="logo-preset-btn active border border-indigo-500 bg-indigo-600/15 text-slate-100 p-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                            None
                        </button>
                        <button onclick="selectPresetLogo('google')" class="logo-preset-btn border border-slate-800/80 hover:border-slate-700 bg-slate-950 text-slate-300 p-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                            <i class="fa-brands fa-google text-rose-500"></i> Google
                        </button>
                        <button onclick="selectPresetLogo('whatsapp')" class="logo-preset-btn border border-slate-800/80 hover:border-slate-700 bg-slate-950 text-slate-300 p-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                            <i class="fa-brands fa-whatsapp text-emerald-500"></i> WhatsApp
                        </button>
                        <button onclick="selectPresetLogo('github')" class="logo-preset-btn border border-slate-800/80 hover:border-slate-700 bg-slate-950 text-slate-300 p-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                            <i class="fa-brands fa-github text-white"></i> GitHub
                        </button>
                        <!-- Custom Logo Input -->
                        <label class="logo-preset-btn cursor-pointer border border-dashed border-slate-800 hover:border-slate-600 bg-slate-950 text-slate-400 hover:text-slate-200 p-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                            <input type="file" id="logo-file-input" accept="image/*" class="hidden" onchange="uploadCustomLogo(event)">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Custom
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Live Preview Panel (5 Cols) -->
        <section class="lg:col-span-5 space-y-6 lg:sticky lg:top-[90px] h-fit">
            
            <!-- Live QR Display -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl flex flex-col items-center justify-center text-center space-y-6">
                <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest w-full text-left">Live Preview</h3>
                
                <!-- Interactive QR Frame -->
                <div class="relative p-4 rounded-3xl bg-slate-950 border border-slate-800/50 shadow-inner flex items-center justify-center aspect-square w-full max-w-[300px]">
                    <div id="canvas-container" class="w-full h-full flex items-center justify-center overflow-hidden rounded-2xl"></div>
                </div>

                <!-- Export / Download Options -->
                <div class="w-full space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="downloadQR('png')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/10 transition-all">
                            <i class="fa-solid fa-download"></i> Download PNG
                        </button>
                        <button onclick="downloadQR('svg')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/50 hover:border-slate-600 text-slate-200 font-semibold text-sm transition-all">
                            <i class="fa-solid fa-file-code"></i> Download SVG
                        </button>
                    </div>
                    <button onclick="copyImageToClipboard()" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-slate-900/50 hover:bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 text-sm transition-all">
                        <i class="fa-solid fa-copy"></i> Copy to Clipboard
                    </button>
                </div>
            </div>

            <!-- Design History / Recent List -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Recent Creations</h3>
                    <button onclick="clearHistory()" class="text-xs text-rose-400 hover:text-rose-300 transition-all">Clear</button>
                </div>
                
                <div id="history-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- History items injected here dynamically -->
                    <div id="no-history-msg" class="text-center py-6 text-sm text-slate-500">
                        No recent generations yet.
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm font-medium shadow-xl flex items-center gap-2 translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-msg">Action Completed</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
